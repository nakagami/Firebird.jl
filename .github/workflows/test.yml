name: Run tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.11', '1.12', '1.13']
        firebird-version: ['3', '4', '5']

    services:
      firebird:
        image: firebirdsql/firebird:${{ matrix.firebird-version }}
        env:
          FIREBIRD_ROOT_PASSWORD: masterkey
          # Same settings as misc/firebird.conf
          FIREBIRD_CONF_AuthServer: Srp256, Srp, Legacy_Auth
          FIREBIRD_CONF_WireCrypt: Enabled
          FIREBIRD_CONF_DefaultTimeZone: GMT
        ports:
          - 3050:3050
        # The job waits until the server accepts connections inside the container
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/localhost/3050'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
    - uses: actions/checkout@v7

    - uses: julia-actions/setup-julia@v3
      with:
        version: ${{ matrix.julia-version }}
    - uses: julia-actions/julia-buildpkg@v1
      with:
        ignore-no-cache: true

    - name: Test
      env:
        ISC_USER: SYSDBA
        ISC_PASSWORD: masterkey
      run: julia --project -e 'using Pkg;Pkg.test()'
